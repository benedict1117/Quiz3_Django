<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: #111827;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 1px 15px rgb(255, 254, 254);
        }

        .header h1 {
            font-size: 32px;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* MAIN CONTAINER */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 660px;
        }

        /* TITLE */
        .title-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title {
            color: #f8fafc;
            font-size: 24px;
            text-align: center;
        }

        .student-count {
            background: #2563eb;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* TABLE */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 600px;
            height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 16px;
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tbody tr {
            background: #1e293b;
            transition: 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background: #172033;
        }

        tbody tr:hover {
            background: #26354d;
        }


        .student-name {
            font-weight: bold;
            color: #60a5fa;
        }

   
        .course {
            display: inline-block;
            background: #0f3b5f;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }


        td:last-child {
            font-weight: bold;
            color: #cbd5e1;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }


    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Student Management System</h1>
        <p>Django Quiz #3</p>
    </div>


    <!-- MAIN CONTENT -->
    <div class="container">

        <div class="title-section">
            <h2 class="title">Student List</h2>

            <span class="student-count">
                Students
            </span>
        </div>


        <!-- TABLE -->
        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Section</th>
                        <th>Year Level</th>
                    </tr>
                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>

                        <td class="student-name">
                            {{ student.name }}
                        </td>

                        <td>
                            <span class="course">
                                {{ student.course }}
                            </span>
                        </td>
                        <td>
                            <span class="section">
                                {{student.section}}
                            </span>
                        </td>

                        <td>
                            Year {{ student.year_level }}
                        </td>

                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="3" class="empty">
                            No students found.
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
